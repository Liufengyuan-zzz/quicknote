name: Build Desktop Packages (macOS + Windows)

# 触发方式：
#   1. 推 tag（如 v1.6.3）→ 双平台构建 → 汇总产物 → 建 Release
#        Release 里同时放：安装包（dmg/exe/msi）+ 自动更新清单 latest.json
#        客户端用固定链接取清单：/releases/latest/download/latest.json
#   2. 手动触发（Actions 页面点 Run workflow）→ 只构建 + 上传产物，用来验证，**不会建 Release**
#                                              也不会发布更新清单 —— 更新源只跟正式发版走
#
# 注意：手动触发时产物只在这次运行的页面底部 Artifacts 里，Release（固定下载链接）
# 必须靠推 tag 才会生成。这是刻意设计的区分：验证用和正式发版用应分开。
#
# ---- 构建需要的 Secrets ----
#   VITE_CLOUD_ENDPOINT / VITE_CLOUD_KEY
#       前端连接云端的公开标识（源码里不写死，模板见 .env.example）。
#       缺了会构建出「连不上后端」的包，所以下面有断言步骤直接拦下。
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#       更新包签名私钥（npm run tauri signer generate 产出）与它的密码。
#       缺了会导致「构建成功但用户更新不了」，构建后有断言步骤兜底。
#       ⚠️ 私钥或密码一旦丢失，就再也签不出更新包，所有客户端只能手动重装 —— 务必另行备份。
#
# ---- macOS 签名策略（自动两态，无需改代码）----
#   未配置 Secrets          → ad-hoc 签名。可安装，但用户首次打开需点「仍要打开」。
#   配置了 5 个 Secrets     → Developer ID 正式签名 + Apple 公证。双击即开，零提示。
#   需要的 Secrets：APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
#                   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   证书不存在时签名会静默跳过（Tauri 的行为），因此下面有断言步骤兜底 —— 绝不能
#   出现"构建成功但包是坏的"。详见 Prepare macOS signing credentials 与校验步骤的注释。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 连续触发时取消尚未跑完的旧任务，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      # 单平台失败不拖累另一个 —— 至少能拿到一个平台的包，也便于快速定位问题
      fail-fast: false
      matrix:
        include:
          # ---- macOS：只出 Apple Silicon（M 系列），用户明确不要 Intel ----
          # macos-15 = macOS 15 Arm64。注意：macos-14 虽是 arm64 但已被 GitHub 标记
          # deprecated（runner-images issue #13518）；Intel 变体是 macos-15-intel，别选错。
          - label: macOS arm64
            os: macos-15
            rust-target: aarch64-apple-darwin
            artifact-name: QuickNote-macos-arm64
            # .dmg 给人手动装；.app.tar.gz + .sig 是自动更新用的（用户点一下就换掉本体）
            artifact-path: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

          # ---- Windows：x64，出 nsis 安装包(.exe) + msi ----
          # windows-latest = Windows Server 2025 x64（自带 MSVC 工具链；
          # WiX / NSIS 由 Tauri 构建时自动下载，无需预装）
          - label: Windows x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact-name: QuickNote-windows-x64
            artifact-path: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig

    runs-on: ${{ matrix.os }}

    steps:
      # action 版本统一用当前主版本。切勿降级成 v4 —— 那批跑在 Node 20 上，
      # 而 GitHub 自 2026-06-02 起已强制 Actions 使用 Node 24，旧版会有运行风险。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # 必开：Rust 依赖树很大，缓存能把首次 15 分钟压到 3-5 分钟，
      # 直接决定每月免费额度够不够用。
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      # ---- 前端云端参数注入 ----
      # vite 只把 VITE_ 前缀的变量暴露给前端。写进 .env.production.local（vite build
      # 会自动加载，且已被 .gitignore 排除），比直接传 env 更稳 —— 不依赖加载顺序。
      # 缺这两个值会构建出「连不上云端」的包，所以在这里直接断言中止。
      - name: Write cloud config for vite
        shell: bash
        env:
          VITE_CLOUD_ENDPOINT: ${{ secrets.VITE_CLOUD_ENDPOINT }}
          VITE_CLOUD_KEY: ${{ secrets.VITE_CLOUD_KEY }}
        run: |
          if [ -z "$VITE_CLOUD_ENDPOINT" ] || [ -z "$VITE_CLOUD_KEY" ]; then
            echo "::error::缺少 VITE_CLOUD_ENDPOINT / VITE_CLOUD_KEY Secrets —— 构建出的 App 会连不上云端，已中止"
            exit 1
          fi
          printf 'VITE_CLOUD_ENDPOINT=%s\nVITE_CLOUD_KEY=%s\n' \
            "$VITE_CLOUD_ENDPOINT" "$VITE_CLOUD_KEY" > .env.production.local
          echo "已写入 .env.production.local（值不打印）"

      # ---- macOS 签名/公证凭据准备 ----
      # 用 shell 判断而不是直接 `env: APPLE_CERTIFICATE: ${{ secrets.X }}`，原因是：
      # secrets 未配置时 GitHub 会把该变量设成**空字符串**，而 Tauri 用 var_os() 读环境变量，
      # 空串同样是 Some("")，会走进"有证书"分支去 base64 解码空串 → 构建直接报错。
      # 所以未配置时必须**完全不设置**这些变量，而不是设成空值。
      #
      # 两种状态：
      #   A. 未配置证书（当前）→ 退回 ad-hoc 签名（APPLE_SIGNING_IDENTITY="-"）
      #   B. 已配置证书         → Developer ID 正式签名；若公证凭据齐全则一并公证+装订票据
      - name: Prepare macOS signing credentials
        # 用 startsWith 而不是写死 macos-15：写死标签的话，将来把 runner 换成
        # macos-latest / macos-26 时本步会连同下面的校验步骤**一起被静默跳过** ——
        # 既不设置签名、也不报错，直接产出未签名的坏包。
        if: startsWith(matrix.os, 'macos')
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::warning::未配置签名证书 → 退回 ad-hoc 签名。用户首次安装需在「系统设置 → 隐私与安全性」点「仍要打开」。"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "已检测到签名证书 → 启用 Developer ID 正式签名"
          echo "APPLE_CERTIFICATE=$CERT_B64" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
          # 此处**不设置** APPLE_SIGNING_IDENTITY：Tauri 会从 APPLE_CERTIFICATE 推断证书的真实身份。
          # 反过来说，tauri.conf.json 里也绝不能留死 signingIdentity ——
          # Tauri 的 keychain() 会校验「证书身份是否包含所给 identity」，不匹配会直接报
          # "certificate ... does not match provided identity" 并中断构建。

          # 公证凭据三者必须齐全：notarize_auth() 在「有 APPLE_ID、有 APPLE_PASSWORD、缺 TEAM_ID」
          # 时返回 MissingTeamId，而 app.rs 对该错误是**直接构建失败**（不是静默跳过公证）。
          if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM" ]; then
            echo "已配置公证凭据 → 构建后自动提交 Apple 公证并装订票据"
            echo "APPLE_ID=$NOTARY_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$NOTARY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM" >> "$GITHUB_ENV"
          else
            echo "::warning::公证凭据不完整（APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 需三者齐全）→ 只签名、不公证。应用仍会被 Gatekeeper 拦，但提示会变成可放行的「无法验证开发者」。"
          fi

      # beforeBuildCommand (vite build) 由 tauri 自动执行
      # ---- 更新签名 ----
      # 两个 Secret 缺一不可，否则 createUpdaterArtifacts 生成的更新包没有 .sig，
      # 客户端会拒绝安装（更新器强制验签，这是防止被塞假包的唯一防线）。
      # 私钥 = `npm run tauri signer generate` 产出的文件内容；密码即生成时设置的密码。
      - name: Build Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.rust-target }}

      # ---- 更新产物校验 ----
      # 与 macOS 签名校验同样的道理：Tauri 在「没有私钥」时是静默跳过签名的，
      # 结果是构建成功、包里却没有 .sig —— 线上表现是用户永远更新不了，
      # 而且要到用户点更新时才发现。必须在这里断言，不能靠日志。
      - name: Verify updater artifacts
        shell: bash
        run: |
          BASE="src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          if [ -d "$BASE/nsis" ]; then
            ART=$(find "$BASE/nsis" -maxdepth 1 -name '*-setup.exe' -print -quit)
            KIND="Windows 更新包 (NSIS .exe)"
          else
            ART=$(find "$BASE/macos" -maxdepth 1 -name '*.tar.gz' -print -quit)
            KIND="macOS 更新包 (.app.tar.gz)"
          fi
          [ -n "$ART" ] || { echo "::error::没有生成更新包（$KIND）—— bundle.createUpdaterArtifacts 是否为 true？"; exit 1; }
          [ -f "$ART.sig" ] || { echo "::error::更新包缺少 $ART.sig —— TAURI_SIGNING_PRIVATE_KEY / _PASSWORD 未配置或错误"; exit 1; }
          echo "更新包就绪：$ART"
          echo "签名：$(head -c 40 "$ART.sig")…"

      # ---- macOS 代码签名校验 ----
      # 未签名的 .app 被下载后带 quarantine 标记，Gatekeeper 会判定为"已损坏，无法打开"
      # （文件其实是好的，这句提示是误导）。
      # ⚠️ Tauri 在"无签名身份"时是**静默跳过**签名的（不报错、不打印日志）—— 这个坑正是
      #    本项目第一版 dmg 的真实故障原因，所以必须断言，不能靠肉眼看日志。
      # 两种状态分别断言：有证书要求 Developer ID + 公证票据；无证书要求 ad-hoc。
      - name: Verify macOS code signature
        # 与 Prepare 步骤保持一致（都用平台前缀判断）：若两者条件不一致，
        # 会出现「设置了签名却没人校验」或反之的漏洞。
        if: startsWith(matrix.os, 'macos')
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          APP=$(find "src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$APP" ] || { echo "::error::没找到 .app 产物"; exit 1; }
          echo "App bundle: $APP"

          # ⚠️ 必须用 --verbose=4 抓取，不能只用 -dv。
          #    codesign 的 Authority 行只在足够高的详细度下才打印；低级别输出里没有它，
          #    结果就是「证书明明签好了，却被断言判成未签名」—— 这是 v1.6.3 首次发版的
          #    真实故障（日志里能看到 Authority=Developer ID Application，断言却失败）。
          #    这里只抓一次，然后把同一份内容既打印又用于断言，避免两者看到的不是一回事。
          info=$(codesign -dv --verbose=4 "$APP" 2>&1 || true)
          echo "$info"

          if [ "$HAS_CERT" = "true" ]; then
            echo "$info" | grep -q 'Developer ID Application' \
              || { echo "::error::期望 Developer ID 正式签名，实际未匹配 —— 证书或 signingIdentity 配置有误"; exit 1; }
            codesign --verify --strict --verbose=2 "$APP" || { echo "::error::代码签名严格校验失败"; exit 1; }
            # 公证票据装订在 app 内部，离线也能验证；缺票据时只告警（不阻断），
            # 因为在线环境 Gatekeeper 可直接向 Apple 查询。
            if xcrun stapler validate "$APP"; then
              echo "公证票据校验通过 —— 用户双击即可打开，无需任何手动放行"
            else
              echo "::warning::未找到装订的公证票据（stapling）—— 离线首次打开仍可能被拦"
            fi
          else
            echo "$info" | grep -qi 'adhoc' \
              || { echo "::error::既非正式签名也非 ad-hoc —— 用户端会提示「已损坏，无法打开」"; exit 1; }
            codesign --verify "$APP" || { echo "::error::代码签名校验失败"; exit 1; }
          fi

      # if-no-files-found: error —— 万一输出路径或打包目标变了，宁可直接失败，
      # 也不要"构建成功但没产物"被静默忽略。
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 90
  # 两个平台都跑完后统一发布，避免两个 build job 同时抢着创建同一个 Release
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # 需要仓库文件：scripts/publish-update.py 与 src-tauri/tauri.conf.json
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: List files to publish
        run: find installers -type f | sort

      # ---- 生成自动更新清单 ----
      # 客户端用固定链接取它：releases/latest/download/latest.json
      # 脚本内含「App 内 endpoint 与本次发布位置是否一致」的校验，不一致直接失败 ——
      # 挡住「只改了一边」导致的「发了新版却永远不提示更新」这类哑故障。
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate updater manifest (latest.json)
        run: python scripts/publish-update.py --dir installers --out latest.json

      # 清单必须和安装包发在同一个 Release 里 —— 清单里写的就是这些包的下载地址
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            installers/**/*
            latest.json
          generate_release_notes: true
