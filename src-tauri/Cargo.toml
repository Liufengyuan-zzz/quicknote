[package]
name = "quicknote"
version = "1.6.7"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-fs = "2"
# unsafe-headers：必开！
# 插件的 is_unsafe_header() 会拦掉 Origin 头，导致我们无法清空它；
# 插件随后又强制注入 Origin: http://tauri.localhost，
# 云服务端 origin 白名单不认 → 403 + 空响应体 → 前端只看到「请求失败」。
# 开启后 Origin 可控，前端传 Origin:'' 即可让插件把它删掉，请求变"无 Origin"，
# 与 curl / reqwest 探测（已验证 200）行为一致。
tauri-plugin-http = { version = "=2.6.1", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"
# 单实例：再点桌面程序不另开进程，唤起已存在的窗口（否则托盘会出现两个图标）。
# 版本钉 2.4.5：2.5.x 起依赖 tauri ^2.12，会强制升级 tauri/wry（HTTP Origin 绕行方案对版本敏感）。
tauri-plugin-single-instance = "=2.4.5"
