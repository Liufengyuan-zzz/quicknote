[package]
name = "quicknote"
version = "1.6.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-fs = "2"
# unsafe-headers：必开！
# 插件的 is_unsafe_header() 会拦掉 Origin 头，导致我们无法清空它；
# 插件随后又强制注入 Origin: http://tauri.localhost，
# 云服务端 origin 白名单不认 → 403 + 空响应体 → 前端只看到「请求失败」。
# 开启后 Origin 可控，前端传 Origin:'' 即可让插件把它删掉，请求变"无 Origin"，
# 与 curl / reqwest 探测（已验证 200）行为一致。
tauri-plugin-http = { version = "=2.6.1", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"
